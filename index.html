<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Atlas</title>
  <meta name="theme-color" content="#24394b">
  <meta name="description" content="Explore character movements and story timelines.">
  <link rel="icon" type="image/svg+xml" href="assets/story-atlas.svg">
  <link rel="stylesheet" href="css/timeline.css">
  <link id="story-stylesheet" rel="stylesheet" href="css/throne-of-glass.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-title">
        <a class="brand" href="./" aria-label="Story Atlas home">
          <img src="assets/story-atlas.svg" alt="">
          <span>Story Atlas</span>
        </a>
        <h1 id="timeline-heading" class="timeline-title">A Logistical Record of Throne of Glass</h1>
      </div>
      <nav class="story-switcher" aria-label="Story selection">
        <button id="story-menu-toggle" class="story-menu-toggle" type="button" aria-expanded="false" aria-controls="story-nav">
          <span aria-hidden="true">☰</span> <span>Choose story</span>
        </button>
        <span class="story-switcher-label">Explore a story</span>
        <div id="story-nav"></div>
      </nav>
    </div>
  </header>
  <div class="dashboard-layout">
    <main id="timeline-map" aria-label="Story timeline"></main>
    <aside id="timeline-legend" class="timeline-legend" aria-live="polite" aria-label="Field guide" hidden>
      <div class="legend-heading">
        <div>
          <p class="legend-kicker">Field guide</p>
          <strong>In this scene</strong>
        </div>
        <div class="legend-controls">
          
          <button id="clear-selection" type="button" hidden>Clear</button>
        </div>
      </div>
      <div class="legend-heading-actions"><button id="legend-settings-toggle" class="legend-settings-toggle" type="button" aria-label="Open field guide settings" title="Settings" aria-expanded="false" aria-controls="panel-settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="m19 13 2 1-2 3-2-1-2 1v2h-4v-2l-2-1-2 1-2-3 2-1v-2l-2-1 2-3 2 1 2-1V5h4v2l2 1 2-1 2 3-2 1z"/></svg></button></div>
      <div class="legend-tabs" role="tablist" aria-label="Field Guide">
        <button class="legend-tab is-active" id="tab-characters" type="button" role="tab" aria-label="Characters" title="Characters" aria-selected="true" aria-controls="panel-characters" data-tab="characters"><svg class="legend-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3 20c.5-4 2.5-6 6-6s5.5 2 6 6M16 8a2.5 2.5 0 0 1 0 5M17 15c2 .5 3 2 3.5 5"/></svg><span id="legend-character-count" class="legend-tab-count"></span></button>
        <button class="legend-tab" id="tab-locations" type="button" role="tab" aria-label="Locations" title="Locations" aria-selected="false" aria-controls="panel-locations" data-tab="locations" tabindex="-1"><svg class="legend-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="legend-location-count" class="legend-tab-count"></span></button>
        <button class="legend-tab" id="tab-outline" type="button" role="tab" aria-label="Outline" title="Chapter outline" aria-selected="false" aria-controls="panel-outline" data-tab="outline" tabindex="-1"><svg class="legend-tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5h12M8 12h12M8 19h12M3 5h.01M3 12h.01M3 19h.01"/></svg></button>
      </div>
      <div class="legend-panels">
        <section class="legend-panel" id="panel-characters" role="tabpanel" aria-labelledby="tab-characters">
          <div id="legend-characters" class="legend-section"></div>
        </section>
        <section class="legend-panel" id="panel-locations" role="tabpanel" aria-labelledby="tab-locations" hidden>
          <div id="legend-locations" class="legend-section"></div>
        </section>
        <section class="legend-panel" id="panel-outline" role="tabpanel" aria-labelledby="tab-outline" hidden><ol id="legend-outline" class="legend-outline"></ol></section>
        <section class="legend-panel legend-settings-panel" id="panel-settings" aria-label="Field guide settings" hidden>
          <div class="legend-settings-options">
            <label class="legend-setting">
              <input id="show-unchanged-locations" type="checkbox">
              <span>Show unchanged places</span>
            </label>
            <label class="legend-setting legend-setting-select">
              <span>Sort places</span>
              <select id="location-sort">
                <option value="plot">Plot priority</option>
                <option value="faction">Faction</option>
                <option value="count">Character count</option>
                <option value="alphabetical">Alphabetical</option>
              </select>
            </label>
            <label class="legend-setting legend-setting-select">
              <span>Sort characters</span>
              <select id="character-sort">
                <option value="plot">Plot priority</option>
                <option value="faction">Faction</option>
                <option value="alphabetical">Alphabetical</option>
              </select>
            </label>
            <label class="legend-setting"><input id="show-notes-labels" type="checkbox" checked><span>Show notes labels</span></label>
            <label class="legend-setting"><input id="standardize-location-widths" type="checkbox"><span>Standardize location block widths</span></label>
            <label class="legend-setting">
              <input id="show-all-available" type="checkbox">
              <span>Show all available places and characters</span>
            </label>
            <label class="legend-setting">
              <input id="dark-mode-toggle" type="checkbox">
              <span>Dark mode</span>
            </label>
          </div>
        </section>
      </div>
    </aside>
  </div>
  <footer class="site-footer">
    <span>Story Atlas</span>
    <span>Created by <strong>Mackenzie Cope</strong></span>
    <a href="https://github.com/mackenziecope/book-timeline" target="_blank" rel="noopener noreferrer">View source on GitHub</a>
  </footer>

  <script src="js/papaparse.min.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/render.js"></script>
</body>
</html>
